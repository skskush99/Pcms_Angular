<div class="confirm-popup">

  <!-- Top icon badge -->
  <div class="confirm-icon-wrap">
    <div class="confirm-icon-ring"></div>
    <div class="confirm-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
  </div>

  <!-- Title -->
  <h2 class="confirm-title">Confirmation</h2>

  <!-- Divider -->
  <div class="confirm-divider"></div>

  <!-- Message -->
  <p class="confirm-msg">{{ data.msg }}</p>

  <!-- Timer (optional) -->
  <p *ngIf="data.secondsLeft" class="confirm-timer">
    Auto-closing in <strong>{{ data.secondsLeft }}s</strong>
  </p>

  <!-- Action buttons -->
  <div class="confirm-actions">

    <button type="button" class="confirm-btn confirm-btn--no" (click)="onSelectNo()">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      No, Cancel
    </button>

    <button type="button" class="confirm-btn confirm-btn--yes" (click)="onSelectYes()">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Yes, Confirm
    </button>

  </div>

</div>
