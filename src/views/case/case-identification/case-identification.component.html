<div class=" ">
    <form [formGroup]="caseIdentificationForm">
        <div class="grid grid-cols-12 gap-3">

            <div class="col-span-full flex flex-col gap-2.5 mb-4">
                <div>
                    <p class="text-base font-semibold">Register Type<sup class="text-red-500 text-lg font-semibold">*</sup></p>
                </div>
                <div class="flex items-center">
                <div class="mx-5 flex items-center gap-2 col-span-1 border-[#E2E8F0] border-2 p-2 rounded-3xl  w-fit">
                    <input
                    type="radio"
                    formControlName="regType"
                    value="diar"
                    class="w-4 h-4 text-[#496D7E] border-gray-300 focus:ring-[#496D7E]"
                    />
                    <label class="text-sm "
                    >Diar Register</label
                    >  
                </div>
                
                
                <div class="mx-5 flex items-center gap-2 col-span-1 border-[#E2E8F0] border-2 p-2 rounded-3xl  w-fit">
                    <input
                    type="radio"
                    formControlName="regType"
                    value="dispose"
                    class="w-4 h-4 text-[#496D7E] border-gray-300 focus:ring-[#496D7E]"
                    />
                    <label class="text-sm "
                    >Final Dispose</label
                    >  
                </div>
                </div>
            </div>



            <div class="col-span-full ">
                <p class="text-base font-semibold">Search Case Via<sup class="text-red-500 text-lg font-semibold">*</sup></p>
            

                <div
                class="flex flex-wrap gap-8  items-center px-5 py-3 border-b border-gray-200 "
                >
                <div class="flex items-center gap-2 col-span-1 border-[#E2E8F0] border-2 p-2 rounded-3xl ">
                    <input
                    type="radio"
                    formControlName="searchCaseVia"
                    value="fir"
                    class="w-4 h-4 text-[#496D7E] border-gray-300 focus:ring-[#496D7E]"
                    />
                    <label class="text-sm " for="fir"
                    >FIR Details</label
                    >
                    
                </div>

                <div class="flex items-center gap-2 col-span-1 border[#E2E8F0] border-2 p-2 rounded-3xl ">
                    <input
                    type="radio"
                    formControlName="searchCaseVia"
                    value="cnr"
                    
                    class="w-4 h-4 text-[#496D7E] border-gray-300 focus:ring-[#496D7E]"
                    />
                    <label class="text-sm " for="cnr"
                    >CIS / CNR Details</label
                    >
                    
                </div>
                
                
                @if (caseIdentificationForm.value.regType == 'dispose') {
                <div class="flex items-center gap-2 col-span-1 border[#E2E8F0] border-2 p-2 rounded-3xl ">
                    <input
                    type="radio"
                    formControlName="searchCaseVia"
                    value="dierRegNo"
                    
                    class="w-4 h-4 text-[#496D7E] border-gray-300 focus:ring-[#496D7E]"
                    />
                    <label class="text-sm " for="cnr"
                    >Dier Register No.</label
                    >
                    
                </div>
            }
                </div>
            </div>



            @if (caseIdentificationForm.value.searchCaseVia == 'fir') {
            <!-- Thana -->
            <div class="form-group col-span-full ">
                <label for="division" class="block text-base font-semibold text-gray-700 mb-2">
                Thana<sup class="text-red-500 text-lg font-semibold">*</sup>
                </label>

                <ng-select 
                [items]="thanaDropdown"
                bindLabel="text"
                bindValue="value"
                placeholder="Select Thana"
                formControlName="thana"
                class="custom-ng-select"
                id="thana"
                >
                </ng-select>
            </div>


        <div class="col-span-full grid grid-cols-2 gap-4 ">

                    <div class="form-group ">
                            <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-2.5">
                            FIR No.<sup class="text-red-500 text-lg font-semibold">*</sup>
                            </label>
                            <input type="text" id="firNo"
                            formControlName="firNo" 
                            placeholder="Enter FIR No."
                            autocomplete="off"
                            class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">
                            
                    </div>
                    
                    
                    <div class="form-group">
                            <label for="firYear" class="block text-sm font-semibold text-gray-700 mb-2.5">
                            Year of FIR<sup class="text-red-500 text-lg font-semibold">*</sup>
                            </label>
                            <ng-select 
                                [items]="firYearDropdown"
                                bindLabel="text"
                                bindValue="value"
                                placeholder="Select Year of FIR"
                                formControlName="firYear"
                                class="custom-ng-select"
                                id="firYear"
                                >
                            </ng-select>
                    </div>

        </div>

    }
    @else {
        <div class="col-span-full grid grid-cols-12">
                    <div class="form-group col-span-10">
                            <label for="cisCnr" class="block text-sm font-semibold text-gray-700 mb-2.5">
                            CIS / CNR No.<sup class="text-red-500 text-lg font-semibold">*</sup>
                            </label>
                            <input type="text" id="cisCnr"
                            formControlName="cisCnr" 
                            placeholder="Enter CIS or CNR No."
                            autocomplete="off"
                            class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">
                            
                    </div>
                    <div class="col-span-2 place-self-end">
                        <button (click)="searnCnrCis()" class="bg-[#659bcd] hover:bg-[#3f81c0] text-white rounded-lg px-3 py-2">
                           <i class="fa-solid fa-magnifying-glass"></i> Search By CIS/CNR
                        </button>
                    </div>
        </div>
    }

        </div>
    </form>
</div>
