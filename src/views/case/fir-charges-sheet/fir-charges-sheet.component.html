<div>
    <div class="firDetails border-1 rounded-lg border-[#E2E8F0] px-2.5 py-3.5">
        <div class="heading flex items-center justify-between text-base">
            <p class="font-semibold ">FIR Details (auto-filled when available)</p>      
            <div class="btns flex items-center gap-3">
                <button class="py-1.5 px-2.5 bg-[#059669] text-white rounded-lg">Fetch From CCTNS</button>
                <button class="py-1.5 px-2.5 bg-[#059669] text-white rounded-lg">FIR Manual Entry</button>
                <button class="py-1.5 px-2.5 bg-inherit text-black rounded-lg border-[#E2E8F0] border-1">Clear</button>
            </div> 
        </div>

        <div class="firDetailsForm grid grid-cols-1 md:grid-cols-3 gap-4 mt-5 text-base">
                    <div class="form-group ">
                        <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                        FIR संख्या (CCTNS)<sup class="text-red-500 text-lg font-semibold">*</sup>
                        </label>
                        <input type="text" id="firNo"
                        formControlName="firNo" 
                        placeholder="Enter FIR संख्या (CCTNS)"
                        autocomplete="off"
                        class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">        
                    </div>
                    
                    
                    <div class="form-group ">
                        <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                        FIR की तिथि (CCTNS)<sup class="text-red-500 text-lg font-semibold">*</sup>
                        </label>
                        <app-date-picker></app-date-picker>
                    </div>

                    <div class="form-group ">
                        <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                        थाना का नाम (CCTNS)<sup class="text-red-500 text-lg font-semibold">*</sup>
                        </label>
                        <input type="text" id="firNo"
                        formControlName="firNo" 
                        placeholder="Enter थाना का नाम (CCTNS)"
                        autocomplete="off"
                        class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">        
                    </div>

                    <div class="form-group ">
                        <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                        थाना कोड (CCTNS)<sup class="text-red-500 text-lg font-semibold">*</sup>
                        </label>
                        <input type="text" id="firNo"
                        formControlName="firNo" 
                        placeholder="Enter थाना कोड (CCTNS)"
                        autocomplete="off"
                        class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">        
                    </div>

                    <div class="form-group ">
                        <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                        अनुसन्धान अधिकारी का नाम एवं पद (CCTNS)<sup class="text-red-500 text-lg font-semibold">*</sup>
                        </label>
                        <input type="text" id="firNo"
                        formControlName="firNo" 
                        placeholder="Enter अनुसन्धान अधिकारी का नाम एवं पद (CCTNS)"
                        autocomplete="off"
                        class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">        
                    </div>
        </div>
    </div>


    <div class="caseSheetDetails px-2.5 py-3.5">
        <p class="my-3 text-lg font-semibold">Charge Sheet Details</p>
        

        <div class="caseSheetDetailForm grid grid-cols-1 md:grid-cols-3 gap-4 mt-3 text-base">

                <!-- Charge-Sheet No. -->
                <div class="form-group ">
                    <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                    Charge-Sheet No.<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <input type="text" id="firNo"
                    formControlName="firNo" 
                    placeholder="Enter Charge-Sheet No." autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">        
                </div>


                <!-- Charge-Sheet Date -->
                <div class="form-group ">
                    <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                    Charge-Sheet Date<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <!-- <input type="text" id="firNo"
                    formControlName="firNo" 
                    placeholder="Enter Charge-Sheet Date" autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">         -->
                    <app-date-picker></app-date-picker>
                </div>
                
                
                <!-- Date of Filing Before Court -->
                <div class="form-group ">
                    <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                    Date of Filing Before Court<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <!-- <input type="text" id="firNo"
                    formControlName="firNo" 
                    placeholder="Enter Charge-Sheet Date" autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">         -->
                    <app-date-picker></app-date-picker>
                </div>


                <!-- Charge-Sheet No. -->
                <div class="form-group ">
                    <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                    Investigating Officer (Name & Rank)<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <input type="text" id="firNo"
                    formControlName="firNo" 
                    placeholder="Enter Investigating Officer (Name & Rank)" autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">        
                </div>
                
                
                
                <!-- Case Title -->
                <div class="form-group ">
                    <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                    Case Title<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <input type="text" id="firNo"
                    formControlName="firNo" 
                    placeholder="Enter Case Title" autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">        
                </div>
                
                
                <!-- अपराध का वर्गीकरण (Classification) -->
                <div class="form-group ">
                    <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                    अपराध का वर्गीकरण (Classification)<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <ng-select 
                        [items]="classificationDropdown"
                        bindLabel="text"
                        bindValue="value"
                        placeholder="Select Year of FIR"
                        formControlName="firYear"
                        class="custom-ng-select"
                        id="firYear"
                        >
                    </ng-select>
                </div>
                
                
                
                <!-- अधिनियम ((Acts) -->
                <div class="form-group ">
                    <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                    अधिनियम (Acts)<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <ng-select 
                        [items]="actsDropdown"
                        bindLabel="text"
                        bindValue="value"
                        placeholder="Select Year of FIR"
                        formControlName="firYear"
                        class="custom-ng-select"
                        id="firYear"
                        >
                    </ng-select>
                </div>
                
                
                <!-- धाराएँ (Sections) -->
                <div class="form-group ">
                    <label for="firNo" class="block text-sm font-semibold text-gray-700 mb-1.5">
                    धाराएँ (Sections)<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <ng-select 
                        [items]="sectionsDropdown"
                        bindLabel="text"
                        bindValue="value"
                        placeholder="Select Year of FIR"
                        formControlName="firYear"
                        class="custom-ng-select"
                        id="firYear"
                        >
                    </ng-select>
                </div>
        </div>
    </div>
</div>
