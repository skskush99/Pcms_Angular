<div class="mx-2">
    <form [formGroup]="pariesForm">
        <div class="accused" formArrayName="accused">
            <div class="heading flex items-center justify-between">
                <p class="text-base font-semibold tracking-wider">अभियुक्त विवरण (Accused)</p>
                <button class="flex items-center gap-2 bg-[#9333EA] text-white rounded-2xl px-2.5 py-1.5 font-400" (click)="addAccused()"><i class="fa-solid fa-plus"></i>Add Accused</button>
            </div>

            <div *ngFor="let accuse of accused.controls; let i=index"  [formGroupName]="i" class="accused-form grid grid-cols-1 md:grid-cols-3 gap-4 mt-3 border-1 border-[#E2E8F0] rounded-lg p-2.5">

                <!-- Name -->
                <div class="form-group ">
                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-2.5">
                    Name<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <input type="text" id="name"
                    formControlName="accusedName" 
                    placeholder="Enter Name"
                    autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">       
                </div>
                
                
                <!-- Address -->
                <div class="form-group ">
                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-2.5">
                    Address<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <input type="text" id="name"
                    formControlName="accusedAddress" 
                    placeholder="Enter Address"
                    autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">       
                </div>
                
                <div class="flex items-center gap-3">
                    <!-- Age / Gender -->
                    <div class="form-group w-full">
                        <label for="accusedAge" class="block text-sm font-semibold text-gray-700 mb-2.5">
                            Age<sup class="text-red-500 text-lg font-semibold">*</sup>
                        </label>
                        <input type="text" id="accusedAge"
                        formControlName="accusedAge" 
                        placeholder="Enter Age"
                        (keypress)="restrictKeys.onlyNumber($event)"
                        autocomplete="off"
                        class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">       
                    </div>

                    <div class="form-group w-full">
                        <label for="accusedGender" class="block text-sm font-semibold text-gray-700 mb-2.5">
                            Gender<sup class="text-red-500 text-lg font-semibold">*</sup>
                        </label>
                        <select type="text" id="accusedGender"
                        formControlName="accusedGender" 
                        placeholder="Gender"
                        autocomplete="off"
                        class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm"> 
                            <option value="">--Select Gender--</option>
                            <option value="M">Male</option>
                            <option value="F">Female</option>
                            <option value="O">Other</option>
                        </select>
                    </div>
                </div>
                
                <!-- Status -->
                <div class="form-group ">
                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-2.5">
                    Status<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <ng-select 
                        [items]="statusDropdown"
                        bindLabel="text"
                        bindValue="value"
                        placeholder="Select Year of FIR"
                        formControlName="accusedStatus"
                        class="custom-ng-select"
                        id="firYear"
                        >
                    </ng-select>       
                </div>

                <!-- Remark -->
                <div class="form-group ">
                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-2.5">
                    Remark<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <input type="text" id="name"
                    formControlName="accusedRemark" 
                    placeholder="Enter Remark"
                    autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">       
                </div>

                <div class="accuse-remove flex items-end justify-start">
                    <button class=" border-2 border-[#E2E8F0] rounded-2xl px-2.5 py-1.5 flex items-center gap-2" (click)="removeAccused(i)"><i class="fa-solid fa-minus"></i>Remove</button>
                </div>


            </div>
        </div>
        
        
        
        <!-- VICTIM  -->
        <div class="victim my-5" formArrayName="victims">
            <div class="heading flex items-center justify-between">
                <p class="text-base font-semibold tracking-wider">पीड़ित / परिवादी विवरण (Victim)</p>
                <button class="flex items-center gap-2 bg-[#BE123C] text-white rounded-2xl px-2.5 py-1.5 font-400" (click)="addVictim()"><i class="fa-solid fa-plus"></i>Add Accused</button>
            </div>

            <div *ngFor="let victim of victims.controls; let i = index" [formGroupName]="i" class="victim-form grid grid-cols-1 md:grid-cols-3 gap-4 mt-3 border-1 border-[#E2E8F0] rounded-lg p-2.5">

                <!-- Name -->
                <div class="form-group ">
                    <label for="victimName" class="block text-sm font-semibold text-gray-700 mb-2.5">
                    Name<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <input type="text" id="victimName"
                    formControlName="victimName" 
                    placeholder="Enter Name"
                    autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">       
                </div>
                
                
                <!-- Address -->
                <div class="form-group ">
                    <label for="victimAddress" class="block text-sm font-semibold text-gray-700 mb-2.5">
                    Address<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <input type="text" id="victimAddress"
                    formControlName="victimAddress" 
                    placeholder="Enter Address"
                    autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">       
                </div>
                
                
                <!-- Age / Gender -->
                 <div class="flex items-center gap-3">
                    <div class="form-group w-full">
                        <label for="victimAge" class="block text-sm font-semibold text-gray-700 mb-2.5">
                        Age<sup class="text-red-500 text-lg font-semibold">*</sup>
                        </label>
                        <input type="text" id="victimAge"
                        formControlName="victimAge" 
                        placeholder="Enter Age"
                        autocomplete="off"
                        class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">       
                    </div>
                    
                    
                    <div class="form-group w-full">
                        <label for="victimGender" class="block text-sm font-semibold text-gray-700 mb-2.5">
                        Gender<sup class="text-red-500 text-lg font-semibold">*</sup>
                        </label>
                        <!-- <input type="text" id="victimGender"
                        formControlName="victimGender" 
                        placeholder="Gender"
                        autocomplete="off"
                        class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">  -->
                        <select type="text" id="victimGender"
                        formControlName="victimGender" 
                        placeholder="Gender"
                        autocomplete="off"
                        class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm"> 
                        <option value="">--Select Gender--</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                        <option value="O">Other</option>
                        </select>
                    </div>
                </div>
                
                <!-- Status -->
                <div class="form-group ">
                    <label for="victimStatus" class="block text-sm font-semibold text-gray-700 mb-2.5">
                    Status<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <ng-select 
                        [items]="statusDropdown"
                        bindLabel="text"
                        bindValue="value"
                        placeholder="Select Year of FIR"
                        formControlName="victimStatus"
                        class="custom-ng-select"
                        id="victimStatus"
                        >
                    </ng-select>       
                </div>

                <!-- Remark -->
                <div class="form-group ">
                    <label for="victimRemark" class="block text-sm font-semibold text-gray-700 mb-2.5">
                    Remark<sup class="text-red-500 text-lg font-semibold">*</sup>
                    </label>
                    <input type="text" id="victimRemark"
                    formControlName="victimRemark" 
                    placeholder="Enter Remark"
                    autocomplete="off"
                    class="w-full px-2 py-1.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">       
                </div>

                <div class="accuse-remove flex items-end justify-start">
                    <button class=" border-2 border-[#E2E8F0] rounded-2xl px-2.5 py-1.5 flex items-center gap-2" (click)="removeVictim(i)"><i class="fa-solid fa-minus"></i>Remove</button>
                </div>


            </div>
        </div>
    </form>
</div>
