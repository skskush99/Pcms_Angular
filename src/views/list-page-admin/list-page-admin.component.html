<div class="forms">
  <div class="complain-form">

    <!-- ===================== FILTER CARD ===================== -->
    <div class="filter-card mb-4">

      <!-- Filter Header -->
      <div class="filter-card-header" (click)="toggleForm()">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-filter filter-header-icon"></i>
          <span class="filter-header-title">Permission Mapping Request Filter</span>
        </div>
        <button type="button" class="filter-toggle-btn">
          <i class="fa-solid fa-filter"></i>
          {{ buttonText }}
        </button>
      </div>

      <!-- Filter Body -->
      <div class="filter-card-body" [@slideInOut]="animationState" [hidden]="isFormCollapsed">
        <form [formGroup]="permissionMappingFilterForm">
          <div class="form-grid">

            <!-- Role -->
            <div class="form-group">
              <label>
                <i class="fa-solid fa-user-shield filter-label-icon"></i>
                Role
              </label>
              <ng-select
                [items]="roleDropdown"
                bindLabel="text"
                bindValue="value"
                placeholder="Select Role"
                formControlName="role"
                class="custom-ng-select"
                appendTo="body">
              </ng-select>
            </div>

            <!-- Department -->
            <div class="form-group">
              <label>
                <i class="fa-solid fa-building filter-label-icon"></i>
                Department
              </label>
              <ng-select
                [items]="deptDropdown"
                bindLabel="text"
                bindValue="value"
                placeholder="Select Department"
                formControlName="dept"
                class="custom-ng-select"
                appendTo="body">
              </ng-select>
            </div>

            <!-- Level -->
            <div class="form-group">
              <label>
                <i class="fa-solid fa-layer-group filter-label-icon"></i>
                Level
              </label>
              <ng-select
                [items]="levelDropdown"
                bindLabel="text"
                bindValue="value"
                placeholder="Select Level"
                formControlName="level"
                class="custom-ng-select"
                appendTo="body">
              </ng-select>
            </div>

            <!-- Office -->
            <div class="form-group">
              <label>
                <i class="fa-solid fa-building-columns filter-label-icon"></i>
                Office
              </label>
              <ng-select
                [items]="officeDropdown"
                bindLabel="text"
                bindValue="value"
                [virtualScroll]="true"
                placeholder="Select Office"
                formControlName="office"
                class="custom-ng-select"
                appendTo="body">
              </ng-select>
            </div>

            <!-- SSO ID -->
            <div class="form-group">
              <label for="sso">
                <i class="fa-solid fa-id-card filter-label-icon"></i>
                SSO ID
              </label>
              <input
                type="text"
                id="sso"
                formControlName="sso"
                placeholder="Enter SSO ID"
                autocomplete="off"
                class="filter-select">
            </div>

            <!-- District -->
            <div class="form-group">
              <label>
                <i class="fa-solid fa-map-location-dot filter-label-icon"></i>
                District
              </label>
              <ng-select
                [items]="districtDropdown"
                bindLabel="text"
                bindValue="value"
                placeholder="Select District"
                formControlName="district"
                class="custom-ng-select"
                appendTo="body">
              </ng-select>
            </div>

            <!-- User Name -->
            <div class="form-group">
              <label for="userName">
                <i class="fa-solid fa-user filter-label-icon"></i>
                User Name
              </label>
              <input
                type="text"
                id="userName"
                formControlName="userName"
                placeholder="Enter User Name"
                autocomplete="off"
                class="filter-select">
            </div>

            <!-- Search / Reset -->
            <div class="filter-btn-group">
              <button type="button" (click)="onSearch()" class="btn-search flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i>
                Search
              </button>
              <button type="button" (click)="resetFilter()" class="btn-clear flex items-center gap-2">
                <i class="fa-solid fa-rotate-left"></i>
                Reset
              </button>
            </div>

          </div>
        </form>
      </div>
    </div>
    <!-- END FILTER CARD -->

    <!-- ===================== TABLE CARD ===================== -->
    <div class="person-card">

      <!-- Table Header -->
      <div class="section-header mb-4">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-list-check filter-header-icon"></i>
          <h3 class="filter-header-title">Permission Mapping Request List</h3>
        </div>
        <!-- <div class="download-buttons">
          <button type="button" (click)="exportExcel()" class="download-btn excel flex items-center gap-2">
            <i class="fa-solid fa-file-excel"></i>
            Excel
          </button>
        </div> -->
      </div>

      <!-- AG Grid -->
      <div class="grid-table-wrapper">
        <ag-grid-angular
          class="ag-theme-quartz"
          style="height: 500px; width: 100%;"
          [rowData]="permissionMappingRequestList"
          [columnDefs]="colDef"
          [pagination]="false">
        </ag-grid-angular>
      </div>

      <!-- Action Bar -->
      <div class="action-bar">

        <!-- Left: Total + Page Size -->
        <div class="pagination-section">
          <span class="total-record">Total Records: {{ totalRecords }}</span>
          <div class="page-size">
            Show:
            <select [(ngModel)]="pageSize" (change)="onPageSizeChanged($event)" class="filter-select">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="9999999">All</option>
            </select>
          </div>
        </div>

        <!-- Center: Pagination -->
        <div class="pagination">
          <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">Prev</button>
          <span>Page {{ currentPage }} of {{ totalPages }}</span>
          <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">Next</button>
        </div>

        <!-- Right: Export -->
        <div class="download-buttons">
          <button type="button" (click)="exportExcel()" class="download-btn excel flex items-center gap-2">
            <i class="fa-solid fa-file-excel"></i>
            Export To Excel
          </button>
          <button type="button" (click)="exportPDF()" class="download-btn pdf flex items-center gap-2">
            <i class="fa-solid fa-file-pdf"></i>
            Export To PDF
          </button>
        </div>

      </div>
      <!-- END ACTION BAR -->

    </div>
    <!-- END TABLE CARD -->

  </div>
</div>
