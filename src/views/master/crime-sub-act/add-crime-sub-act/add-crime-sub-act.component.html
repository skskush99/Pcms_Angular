<div class="forms">
  <div class="complain-form">

    <!-- ===================== FORM CARD ===================== -->
    <div class="person-card">

      <!-- Header -->
      <div class="section-header mb-6">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-scale-balanced filter-header-icon"></i>
          <h3 class="filter-header-title">
            {{ editCrimeSubActData ? 'Edit / Update' : 'Add' }} Crime Sub Act
          </h3>
        </div>

        <!-- Back Button -->
        <button type="button" class="filter-toggle-btn" (click)="onCancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="addCrimeSubActForm">
        <div class="form-grid">

          <!-- Crime Sub Act English Name -->
          <div class="form-group">
            <label for="crimeSubActEnglish">
              <i class="fa-solid fa-font filter-label-icon"></i>
              Crime Sub Act English Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="crimeSubActEnglish"
              formControlName="crimeSubActEnglish"
              placeholder="Enter Crime Sub Act English Name"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addCrimeSubActForm.get('crimeSubActEnglish')?.hasError('required') && addCrimeSubActForm.get('crimeSubActEnglish')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Sub Act English Name is required
            </div>
          </div>

          <!-- Crime Sub Act Hindi Name -->
          <div class="form-group">
            <label for="crimeSubActHindi">
              <i class="fa-solid fa-language filter-label-icon"></i>
              Crime Sub Act Hindi Name
            </label>
            <input
              type="text"
              id="crimeSubActHindi"
              formControlName="crimeSubActHindi"
              placeholder="Enter Crime Sub Act Hindi Name"
              autocomplete="off"
              class="filter-select">
          </div>

          <!-- Crime Sub Act Short Name -->
          <div class="form-group">
            <label for="crimeSubActShort">
              <i class="fa-solid fa-tag filter-label-icon"></i>
              Crime Sub Act Short Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="crimeSubActShort"
              formControlName="crimeSubActShort"
              placeholder="Enter Crime Sub Act Short Name"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addCrimeSubActForm.get('crimeSubActShort')?.hasError('required') && addCrimeSubActForm.get('crimeSubActShort')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Sub Act Short Name is required
            </div>
          </div>

          <!-- Crime Sub Act Description -->
          <div class="form-group">
            <label for="crimeSubActDesc">
              <i class="fa-solid fa-align-left filter-label-icon"></i>
              Crime Sub Act Description
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <textarea
              id="crimeSubActDesc"
              formControlName="crimeSubActDesc"
              placeholder="Enter Crime Sub Act Description"
              autocomplete="off"
              rows="2"
              class="filter-select">
            </textarea>
            <div *ngIf="addCrimeSubActForm.get('crimeSubActDesc')?.hasError('required') && addCrimeSubActForm.get('crimeSubActDesc')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Sub Act Description is required
            </div>
          </div>

          <!-- Crime Classification -->
          <div class="form-group">
            <label for="classification">
              <i class="fa-solid fa-layer-group filter-label-icon"></i>
              Crime Classification
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <ng-select
              [items]="crimeClassificationDropdown"
              bindLabel="text"
              bindValue="value"
              [compareWith]="compareWithFunc"
              placeholder="Select Crime Classification"
              formControlName="classification"
              (change)="getCrimeActDropdown()"
              class="custom-ng-select"
              id="classification"
              appendTo="body">
            </ng-select>
            <div *ngIf="addCrimeSubActForm.get('classification')?.hasError('required') && addCrimeSubActForm.get('classification')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Classification is required
            </div>
          </div>

          <!-- Crime Act -->
          <div class="form-group">
            <label for="crimeAct">
              <i class="fa-solid fa-scale-balanced filter-label-icon"></i>
              Crime Act
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <ng-select
              [items]="crimeActDropdown"
              bindLabel="text"
              bindValue="value"
              [compareWith]="compareWithFunc"
              placeholder="Select Crime Act"
              formControlName="crimeAct"
              class="custom-ng-select"
              id="crimeAct"
              appendTo="body">
            </ng-select>
            <div *ngIf="addCrimeSubActForm.get('crimeAct')?.hasError('required') && addCrimeSubActForm.get('crimeAct')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Act is required
            </div>
          </div>

          <!-- Save / Cancel Buttons -->
          <div class="filter-btn-group">
            <button type="button" (click)="onSave()" class="btn-submit flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              Save
            </button>
            <button type="button" (click)="onCancel()" class="btn-clear flex items-center gap-2">
              <i class="fa-solid fa-xmark"></i>
              Cancel
            </button>
          </div>

        </div>
      </form>

    </div>
    <!-- END FORM CARD -->

  </div>
</div>
