<div class="min-h-screen bg-gradient-to-br from-gray-50 via-blue-50 to-indigo-50 px-4 lg:px-6 py-6">
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 px-4 xl:px-6 mb-6 overflow-hidden">


        <!-- Filter Form Section -->
        <div class="py-6">
     
            <form [formGroup]="adminFilterForm">
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
                    <!-- Court Type -->
                    <div class="form-group">
                        <label for="majorMinor" class="block text-sm font-semibold text-gray-700 mb-2.5">
                            Major/Minor
                        </label>
                        <select id="majorMinor" 
                            formControlName="majorMinor"
                            class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-[#496D7E] focus:border-[#496D7E] outline-none appearance transition-all duration-200 hover:border-gray-300 shadow-sm">
                            <option value="">--All--</option>
                            <option value="Major">Major</option>
                            <option value="Minor">Minor</option>
                            
                        </select>
                    </div>

                    <!-- Search Button -->
                    <div class="flex items-end gap-3">
                        <app-button label="Search" (click)="getAdminDeptList()" look="px-8 py-3 bg-gradient-to-r from-[#496D7E] to-[#5a7f92] hover:from-[#3d5a6a] hover:to-[#496D7E] text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 flex items-center gap-2"></app-button>
                        <button type="button" (click)="resetFilters()"
                            class="px-8 py-3 bg-gradient-to-r from-[#2f3842] to-[#26313c] hover:from-[#1f2529] hover:to-[#1a1f24] text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 flex items-center gap-2">
                           <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                           </svg>
                           Reset
                        </button>
                    </div>

                   
                </div>
            </form>
        </div>
        </div>
 <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">

          <!-- Header Section -->
          <div class="flex justify-between items-center px-6 py-4 bg-gradient-to-r from-[#759fce] via-[#6b9bc8] to-[#759fce] border-b border-white/20">
              <div class="flex items-center gap-3">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                 </svg>
                 <h2 class="text-lg font-bold text-white">Administrative Department List</h2>
              </div>
              <div class="flex justify-end gap-3">

                <!-- Print Button Section -->
               
                <!-- <button (click)="exportExcel()"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-md transition-colors duration-200">
                    Export To Excel
                </button> -->

                <!-- <button class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-md transition-colors duration-200" (click)="exportPDF()">
                    Print
                  </button> -->

                <!-- @if(permissionByRole?.isAddPermission) { -->
              <button 
                  class="px-5 py-2.5 bg-gradient-to-r from-[#4CAF50] to-[#229726] hover:from-[#45a049] hover:to-[#1e8521] text-white font-semibold rounded-lg transition-all duration-300 shadow-lg hover:shadow-xl transform hover:scale-105 text-sm flex items-center gap-2"
                  (click)="addNewAdminDept()">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                  </svg>
                  Add New Admin Department
              </button>
            <!-- } -->
            </div>
          </div>

          <!-- Main Content -->
          <div class="p-6">
             

              <!-- Grid Section -->
              <div class="ag-grid-container rounded-lg overflow-hidden border border-gray-200 shadow-inner">
                  <ag-grid-angular (gridReady)="onGridReady($event)"
                      style="height: 500px; width: 100%;"
                      class="ag-theme-quartz"
                      (columnHeaderClicked)="onColumnHeaderClicked($event)"
                      
                       [rowData]="adminDeptList"
                      [columnDefs]="colDef"
                      [pagination]="false"
                        
                      >
                      
                  </ag-grid-angular>
              </div>

              <!-- Pagination Section -->
              <div class="flex items-center justify-between mt-6 px-2 py-4 bg-gray-50 rounded-lg border border-gray-200">
                  <!-- Page Size Selector -->
                  <div class="flex items-center gap-3">
                      <label for="pageSize" class="text-sm font-semibold text-gray-700">Show:</label>
                      <select 
                          id="pageSize" 
                          (change)="onPageSizeChanged($event)"
                          class="px-4 py-2 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-[#496D7E] focus:border-[#496D7E] outline-none appearance transition-all duration-200 hover:border-gray-300 shadow-sm">
                          <option value="10">10</option>
                          <option value="20">20</option>
                          <option value="30">30</option>
                          <option value="50">50</option>
                          <option value="9999999">All</option>
                      </select>
                      <span class="text-sm text-gray-600 font-medium">entries</span>
                  </div>

                  <!-- Custom Pagination Component -->
                  <app-pagination 
                      [currentPage]="currentPage" 
                      [limit]="pageSize" 
                      [total]="totalRecords" 
                      (changePage)="changePage($event)">
                  </app-pagination>
              </div>
          </div>
      </div>
  <!-- </div> -->
</div>
