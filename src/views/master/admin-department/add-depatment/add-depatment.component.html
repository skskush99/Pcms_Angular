<div class="forms">
  <div class="complain-form">

    <!-- ===================== FORM CARD ===================== -->
    <div class="person-card">

      <!-- Header -->
      <div class="section-header mb-6">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-building filter-header-icon"></i>
          <h3 class="filter-header-title">
            {{ editAdminDept ? 'Edit / Update' : 'Add' }} Department
          </h3>
        </div>

        <!-- Back Button -->
        <button type="button" class="filter-toggle-btn" (click)="onCancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="addAdminDeptForm">
        <div class="form-grid">

          <!-- Department Name -->
          <div class="form-group">
            <label for="adminDept">
              <i class="fa-solid fa-building filter-label-icon"></i>
              Department
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="adminDept"
              formControlName="adminDept"
              placeholder="Enter Admin Department"
              autocomplete="off"
              (keypress)="restrictChar.onlyAlphabets($event)"
              class="filter-select">
            <div *ngIf="addAdminDeptForm.get('adminDept')?.hasError('required') && addAdminDeptForm.get('adminDept')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Department Name is required
            </div>
            <div *ngIf="addAdminDeptForm.get('adminDept')?.hasError('pattern') && addAdminDeptForm.get('adminDept')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Department Name should only contain alphabets
            </div>
          </div>

          <!-- Department Short Name -->
          <div class="form-group">
            <label for="shortName">
              <i class="fa-solid fa-tag filter-label-icon"></i>
              Department Short Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="shortName"
              formControlName="shortName"
              placeholder="Enter Short Name"
              autocomplete="off"
              (keypress)="restrictChar.onlyAlphabets($event)"
              class="filter-select">
            <div *ngIf="addAdminDeptForm.get('shortName')?.hasError('required') && addAdminDeptForm.get('shortName')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Short Name is required
            </div>
            <div *ngIf="addAdminDeptForm.get('shortName')?.hasError('pattern') && addAdminDeptForm.get('shortName')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Short Name should only contain alphabets
            </div>
          </div>

          <!-- Save / Cancel Buttons -->
          <div class="filter-btn-group">
            <button type="button" (click)="onSave()" class="btn-submit flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              Save
            </button>
            <button type="button" (click)="onCancel()" class="btn-clear flex items-center gap-2">
              <i class="fa-solid fa-xmark"></i>
              Cancel
            </button>
          </div>

        </div>
      </form>

    </div>
    <!-- END FORM CARD -->

  </div>
</div>
