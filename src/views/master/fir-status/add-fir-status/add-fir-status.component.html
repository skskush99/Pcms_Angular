<div class="forms">
  <div class="complain-form">

    <!-- ===================== FORM CARD ===================== -->
    <div class="person-card">

      <!-- Header -->
      <div class="section-header mb-6">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-file-circle-check filter-header-icon"></i>
          <h3 class="filter-header-title">
            {{ addEditFirStatus ? 'Edit / Update' : 'Add' }} FIR Status
          </h3>
        </div>

        <!-- Back Button -->
        <button type="button" class="filter-toggle-btn" (click)="onCancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="addFirStatusForm">
        <div class="form-grid">

          <!-- FIR Status English Name -->
          <div class="form-group">
            <label for="firStatusEnglish">
              <i class="fa-solid fa-font filter-label-icon"></i>
              FIR Status English Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="firStatusEnglish"
              formControlName="firStatusEnglish"
              placeholder="Enter FIR Status English Name"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addFirStatusForm.get('firStatusEnglish')?.hasError('required') && addFirStatusForm.get('firStatusEnglish')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              FIR Status English Name is required
            </div>
          </div>

          <!-- FIR Status Hindi Name -->
          <div class="form-group">
            <label for="firStatusHindi">
              <i class="fa-solid fa-language filter-label-icon"></i>
              FIR Status Hindi Name
            </label>
            <input
              type="text"
              id="firStatusHindi"
              formControlName="firStatusHindi"
              placeholder="Enter FIR Status Hindi Name"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addFirStatusForm.get('firStatusHindi')?.invalid && addFirStatusForm.get('firStatusHindi')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              FIR Status Hindi Name is required
            </div>
          </div>

          <!-- Save / Cancel Buttons -->
          <div class="filter-btn-group">
            <button type="button" (click)="onSave()" class="btn-submit flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              Save
            </button>
            <button type="button" (click)="onCancel()" class="btn-clear flex items-center gap-2">
              <i class="fa-solid fa-xmark"></i>
              Cancel
            </button>
          </div>

        </div>
      </form>

    </div>
    <!-- END FORM CARD -->

  </div>
</div>
