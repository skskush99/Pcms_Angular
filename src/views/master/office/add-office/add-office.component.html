<div class="forms">
  <div class="complain-form">

    <!-- ===================== FORM CARD ===================== -->
    <div class="person-card">

      <!-- Header -->
      <div class="section-header mb-6">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-building filter-header-icon"></i>
          <h3 class="filter-header-title">
            {{ editOffice ? 'Edit / Update' : 'Add' }} Office
          </h3>
        </div>

        <!-- Back Button -->
        <button type="button" class="filter-toggle-btn" (click)="onCancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="addOfficeForm">
        <div class="form-grid">

          <!-- Office English Name -->
          <div class="form-group">
            <label for="officeEng">
              <i class="fa-solid fa-font filter-label-icon"></i>
              Office English Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="officeEng"
              formControlName="officeEng"
              placeholder="Enter Office English Name"
              autocomplete="off"
              (keypress)="restrictChar.onlyAlphabets($event)"
              class="filter-select">
            <div *ngIf="addOfficeForm.get('officeEng')?.hasError('required') && addOfficeForm.get('officeEng')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Office English Name is required
            </div>
            <div *ngIf="addOfficeForm.get('officeEng')?.hasError('pattern') && addOfficeForm.get('officeEng')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Office English Name should only contain alphabets
            </div>
          </div>

          <!-- Office Hindi Name -->
          <div class="form-group">
            <label for="officeHin">
              <i class="fa-solid fa-language filter-label-icon"></i>
              Office Hindi Name
            </label>
            <input
              type="text"
              id="officeHin"
              formControlName="officeHin"
              placeholder="Enter Office Hindi Name"
              autocomplete="off"
              (keypress)="restrictChar.onlyAlphabets($event)"
              class="filter-select">
          </div>

          <!-- District -->
          <div class="form-group">
            <label for="district">
              <i class="fa-solid fa-map-location-dot filter-label-icon"></i>
              District
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <ng-select
              [items]="districtDropdown"
              bindLabel="text"
              bindValue="value"
              [compareWith]="compareWithFunc"
              placeholder="Select District"
              formControlName="district"
              class="custom-ng-select"
              id="district"
              appendTo="body">
            </ng-select>
            <div *ngIf="addOfficeForm.get('district')?.hasError('required') && addOfficeForm.get('district')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              District is required
            </div>
          </div>

          <!-- Save / Cancel Buttons -->
          <div class="filter-btn-group">
            <button type="button" (click)="onSave()" class="btn-submit flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              Save
            </button>
            <button type="button" (click)="onCancel()" class="btn-clear flex items-center gap-2">
              <i class="fa-solid fa-xmark"></i>
              Cancel
            </button>
          </div>

        </div>
      </form>

    </div>
    <!-- END FORM CARD -->

  </div>
</div>
