<div class="forms">
  <div class="complain-form">

    <div class="person-card">

      <!-- Header -->
      <div class="section-header mb-6">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-gavel filter-header-icon"></i>
          <h3 class="filter-header-title">
            {{ editCourt ? 'Edit / Update' : 'Add' }} Court
          </h3>
        </div>

        <button type="button" class="filter-toggle-btn" (click)="onCancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>
      </div>

      <!-- Form -->
      <form [formGroup]="addCourtForm">
        <div class="form-grid">

          <!-- Court English -->
          <div class="form-group">
            <label for="courtEng">
              Court English Name *
            </label>
            <input
              type="text"
              id="courtEng"
              formControlName="courtEng"
              class="filter-select">
          </div>

          <!-- Court Hindi -->
          <div class="form-group">
            <label for="courtHin">
              Court Hindi Name *
            </label>
            <input
              type="text"
              id="courtHin"
              formControlName="courtHin"
              class="filter-select">
          </div>

          <!-- ✅ Division (FIXED) -->
          <div class="form-group">
            <label for="division">
              Division *
            </label>

            <ng-select
              [items]="divisionDropdown"
              bindLabel="text"
              bindValue="value"
              [compareWith]="compareWithFunc"
              placeholder="Select Division"
              formControlName="division"
              (change)="getDistrictDropdown()"
              appendTo="body">
            </ng-select>

          </div>

          <!-- ✅ District (FIXED) -->
          <div class="form-group">
            <label for="district">
              District
            </label>

            <ng-select
              [items]="districtDropdown"
              bindLabel="text"
              bindValue="value"
              [compareWith]="compareWithFunc"
              placeholder="Select District"
              formControlName="district"
              appendTo="body">
            </ng-select>

          </div>

          <!-- Buttons -->
          <div class="filter-btn-group">
            <button type="button" (click)="onSave()" class="btn-submit">
              Save
            </button>
            <button type="button" (click)="onCancel()" class="btn-clear">
              Cancel
            </button>
          </div>

        </div>
      </form>

    </div>

  </div>
</div>
