<div class="forms">
  <div class="complain-form">

    <!-- ===================== FORM CARD ===================== -->
    <div class="person-card">

      <!-- Header -->
      <div class="section-header mb-6">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-building filter-header-icon"></i>
          <h3 class="filter-header-title">
            {{ editDecisionReason ? 'Edit / Update' : 'Add' }} Case Decision Reason
          </h3>
        </div>

        <!-- Back Button -->
        <button type="button" class="filter-toggle-btn" (click)="onCancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="addDecisionReasonForm">
        <div class="form-grid">
         
          <div class="form-group">
            <label for="decisionReasonEnglish">
              <i class="fa-solid fa-font filter-label-icon"></i>
               Decision Reason English Name 
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="decisionReasonEnglish"
              formControlName="decisionReasonEnglish"
              placeholder="Enter Decision Reason English Name"
              autocomplete="off"
              (keypress)="restrictChar.onlyAlphabets($event)"
              class="filter-select">
            <div *ngIf="addDecisionReasonForm.get('decisionReasonEnglish')?.hasError('required') && addDecisionReasonForm.get('decisionReasonEnglish')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
               Decision Reason English Name is required
            </div>
            <div *ngIf="addDecisionReasonForm.get('decisionReasonEnglish')?.hasError('pattern') && addDecisionReasonForm.get('decisionReasonEnglish')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Decision Reason English Name should only contain alphabets
            </div>
          </div>

       
          <div class="form-group">
            <label for="decisionReasonHindi">
              <i class="fa-solid fa-language filter-label-icon"></i>
             Decision Reason Hindi Name
            </label>
            <input
              type="text"
              id="decisionReasonHindi"
              formControlName="decisionReasonHindi"
              placeholder="Enter Decision Reason Hindi Name"
              autocomplete="off"
              (keypress)="restrictChar.onlyAlphabets($event)"
              class="filter-select">
          </div>

         
          <div class="form-group">
            <label for="decisionType"> 
              <i class="fa-solid fa-map-location-dot filter-label-icon"></i>
             Case Decision Type
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <ng-select
              [items]="decisionTypeDropdown"
              bindLabel="text"
              bindValue="value"
              [compareWith]="compareWithFunc"
              placeholder="Select Case Decision Type"
              formControlName="decisionType"
              class="custom-ng-select"
              id="decisionType"
              appendTo="body">
            </ng-select>
            <div *ngIf="addDecisionReasonForm.get('decisionType')?.hasError('required') && addDecisionReasonForm.get('decisionType')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
               Case Decision Type is required
            </div>
          </div>

          <!-- Save / Cancel Buttons -->
          <div class="filter-btn-group">
            <button type="button" (click)="onSave()" class="btn-submit flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              Save
            </button>
            <button type="button" (click)="onCancel()" class="btn-clear flex items-center gap-2">
              <i class="fa-solid fa-xmark"></i>
              Cancel
            </button>
          </div>

        </div>
      </form>

    </div>
    <!-- END FORM CARD -->

  </div>
</div>
