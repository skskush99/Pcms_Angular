<div class="forms">
  <div class="complain-form">

    <!-- ===================== FORM CARD ===================== -->
    <div class="person-card">

      <!-- Header -->
      <div class="section-header mb-6">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-scale-balanced filter-header-icon"></i>
          <h3 class="filter-header-title">
            {{ editCrimeActData ? 'Edit / Update' : 'Add' }} Crime Act
          </h3>
        </div>

        <!-- Back Button -->
        <button type="button" class="filter-toggle-btn" (click)="onCancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="addCrimeActForm">
        <div class="form-grid">

          <!-- Crime Act English Name -->
          <div class="form-group">
            <label for="crimeActEnglish">
              <i class="fa-solid fa-font filter-label-icon"></i>
              Crime Act English Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="crimeActEnglish"
              formControlName="crimeActEnglish"
              placeholder="Enter Crime Act English Name"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addCrimeActForm.get('crimeActEnglish')?.hasError('required') && addCrimeActForm.get('crimeActEnglish')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Act English Name is required
            </div>
          </div>

          <!-- Crime Act Hindi Name -->
          <div class="form-group">
            <label for="crimeActHindi">
              <i class="fa-solid fa-language filter-label-icon"></i>
              Crime Act Hindi Name
            </label>
            <input
              type="text"
              id="crimeActHindi"
              formControlName="crimeActHindi"
              placeholder="Enter Crime Act Hindi Name"
              autocomplete="off"
              class="filter-select">
          </div>

          <!-- Crime Act Short Name -->
          <div class="form-group">
            <label for="crimeActShort">
              <i class="fa-solid fa-tag filter-label-icon"></i>
              Crime Act Short Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="crimeActShort"
              formControlName="crimeActShort"
              placeholder="Enter Crime Act Short Name"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addCrimeActForm.get('crimeActShort')?.hasError('required') && addCrimeActForm.get('crimeActShort')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Act Short Name is required
            </div>
          </div>

          <!-- Crime Act Description -->
          <div class="form-group">
            <label for="crmieActDesc">
              <i class="fa-solid fa-align-left filter-label-icon"></i>
              Crime Act Description
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <textarea
              id="crmieActDesc"
              formControlName="crmieActDesc"
              placeholder="Enter Crime Act Description"
              autocomplete="off"
              rows="2"
              class="filter-select">
            </textarea>
            <div *ngIf="addCrimeActForm.get('crmieActDesc')?.hasError('required') && addCrimeActForm.get('crmieActDesc')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Act Description is required
            </div>
          </div>

          <!-- Crime Classification -->
          <div class="form-group">
            <label for="classification">
              <i class="fa-solid fa-layer-group filter-label-icon"></i>
              Crime Classification
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <ng-select
              [items]="crimeClassificationDropdown"
              bindLabel="text"
              bindValue="value"
              [compareWith]="compareWithFunc"
              placeholder="Select Crime Classification"
              formControlName="classification"
              class="custom-ng-select"
              id="classification"
              appendTo="body">
            </ng-select>
            <div *ngIf="addCrimeActForm.get('classification')?.hasError('required') && addCrimeActForm.get('classification')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Classification is required
            </div>
          </div>

          <!-- Save / Cancel Buttons -->
          <div class="filter-btn-group">
            <button type="button" (click)="onSave()" class="btn-submit flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              Save
            </button>
            <button type="button" (click)="onCancel()" class="btn-clear flex items-center gap-2">
              <i class="fa-solid fa-xmark"></i>
              Cancel
            </button>
          </div>

        </div>
      </form>

    </div>
    <!-- END FORM CARD -->

  </div>
</div>
