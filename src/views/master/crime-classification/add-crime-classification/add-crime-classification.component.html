<div class="forms">
  <div class="complain-form">

    <!-- ===================== FORM CARD ===================== -->
    <div class="person-card">

      <!-- Header -->
      <div class="section-header mb-6">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-layer-group filter-header-icon"></i>
          <h3 class="filter-header-title">
            {{ editCrimeClassification ? 'Edit / Update' : 'Add' }} Crime Classification
          </h3>
        </div>

        <!-- Back Button -->
        <button type="button" class="filter-toggle-btn" (click)="onCancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="addClassClassificationForm">
        <div class="form-grid">

          <!-- Crime Classification English Name -->
          <div class="form-group">
            <label for="classificationEnglish">
              <i class="fa-solid fa-font filter-label-icon"></i>
              Crime Classification English Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="classificationEnglish"
              formControlName="classificationEnglish"
              placeholder="Enter Crime Classification English Name"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addClassClassificationForm.get('classificationEnglish')?.hasError('required') && addClassClassificationForm.get('classificationEnglish')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Classification English Name is required
            </div>
          </div>

          <!-- Crime Classification Hindi Name -->
          <div class="form-group">
            <label for="classificationHindi">
              <i class="fa-solid fa-language filter-label-icon"></i>
              Crime Classification Hindi Name
            </label>
            <input
              type="text"
              id="classificationHindi"
              formControlName="classificationHindi"
              placeholder="Enter Crime Classification Hindi Name"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addClassClassificationForm.get('classificationHindi')?.invalid && addClassClassificationForm.get('classificationHindi')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Crime Classification Hindi Name is required
            </div>
          </div>

          <!-- Save / Cancel Buttons -->
          <div class="filter-btn-group">
            <button type="button" (click)="onSave()" class="btn-submit flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              Save
            </button>
            <button type="button" (click)="onCancel()" class="btn-clear flex items-center gap-2">
              <i class="fa-solid fa-xmark"></i>
              Cancel
            </button>
          </div>

        </div>
      </form>

    </div>
    <!-- END FORM CARD -->

  </div>
</div>
