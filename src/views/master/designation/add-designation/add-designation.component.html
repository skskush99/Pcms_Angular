<div class="min-h-screen bg-gradient-to-br from-gray-50 via-blue-50 to-indigo-50 px-4 lg:px-6 py-6">
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
          <!-- Header -->
          <div class="flex justify-between items-center px-6 py-4 bg-gradient-to-r from-[#759fce] via-[#6b9bc8] to-[#759fce] border-b border-white/20">
              <div class="flex items-center gap-3">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                 </svg>
                 <h2 class="text-xl font-bold text-white">{{editDesignation ? 'Edit/Update' : 'Add'}} Designation</h2>
              </div>
              <button class="bg-white/20 backdrop-blur-sm hover:bg-white/30 p-2.5 rounded-lg transition-all duration-300 shadow-lg hover:shadow-xl transform hover:scale-110" (click)="onCancel()">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                  </svg>
              </button>
          </div>

          <!-- Form -->
          <div>
              <form [formGroup]="addDesignationForm" class="p-6">
                  <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                      <!-- Designation English Name -->
                      <div class="form-group">
                        <label for="adminDept" class="block text-sm font-semibold text-gray-700 mb-2.5">
                          Designation English Name
                          <sup class="text-red-500 text-base ml-0.5">*</sup>
                        </label>
                        <input type="text" id="adminDept"
                            (keypress)="restrictChar.onlyAlphabets($event)" 
                            formControlName="desigEnglish" 
                            placeholder="Enter Designation English Name"
                            autocomplete="off"
                            class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-[#496D7E] focus:border-[#496D7E] outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">
                        <div *ngIf="addDesignationForm.get('desigEnglish')?.hasError('required') && addDesignationForm.get('desigEnglish')?.touched"
                            class="mt-1.5 text-sm text-red-600 font-medium flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            Designation English Name is required
                        </div>
                        <div *ngIf="addDesignationForm.get('desigEnglish')?.hasError('pattern') && addDesignationForm.get('desigEnglish')?.touched"
                            class="mt-1.5 text-sm text-red-600 font-medium flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            Designation English Name should only contain alphabets
                        </div>
                      </div>


                      <!-- Designation Hindi Name -->
                      <div class="form-group">
                          <label for="desigHindi" class="block text-sm font-semibold text-gray-700 mb-2.5">
                            Designation Hindi Name
                            <sup class="text-red-500 text-base ml-0.5">*</sup>
                          </label>
                          <input type="text" autocomplete="off" 
                              id="desigHindi" (keypress)="restrictChar.onlyAlphabets($event)"
                              formControlName="desigHindi"
                              placeholder="Enter Designation Hindi Name"
                              class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-[#496D7E] focus:border-[#496D7E] outline-none transition-all duration-200 hover:border-gray-300 shadow-sm">
                          <div *ngIf="addDesignationForm.get('desigHindi')?.hasError('required') && addDesignationForm.get('desigHindi')?.touched" 
                              class="mt-1.5 text-sm text-red-600 font-medium flex items-center gap-1">
                              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                              </svg>
                              Designation Hindi Name is required
                          </div>
                          <div *ngIf="addDesignationForm.get('desigHindi')?.hasError('pattern') && addDesignationForm.get('desigHindi')?.touched" 
                              class="mt-1.5 text-sm text-red-600 font-medium flex items-center gap-1">
                              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                              </svg>
                              Designation Hindi Name should only contain alphabets
                          </div>
                      </div>

                      <!-- <div class="">
                        <app-date-picker formControlName="date" [min]="'2025-05-01'"></app-date-picker>
                    </div> -->
                    <div class="flex justify-start mt-8  gap-4 ">
                        <app-button (click)="onSave()" bgType="4" label="Save"></app-button>
                        <app-button (click)="onCancel()" label="Cancel" bgType="5"></app-button>
                    </div>
                  </div>

                  <!-- Action Buttons -->
                 
              </form>
          </div>
      </div>
  <!-- </div> -->
</div>
