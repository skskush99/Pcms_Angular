<div class="forms">
  <div class="complain-form">

    <!-- ===================== FORM CARD ===================== -->
    <div class="person-card">

      <!-- Header -->
      <div class="section-header mb-6">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-briefcase filter-header-icon"></i>
          <h3 class="filter-header-title">
            {{ editDesignation ? 'Edit / Update' : 'Add' }} Designation
          </h3>
        </div>

        <!-- Back Button -->
        <button type="button" class="filter-toggle-btn" (click)="onCancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="addDesignationForm">
        <div class="form-grid">

          <!-- Designation English Name -->
          <div class="form-group">
            <label for="desigEnglish">
              <i class="fa-solid fa-font filter-label-icon"></i>
              Designation English Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="desigEnglish"
              formControlName="desigEnglish"
              placeholder="Enter Designation English Name"
              autocomplete="off"
              (keypress)="restrictChar.onlyAlphabets($event)"
              class="filter-select">
            <div *ngIf="addDesignationForm.get('desigEnglish')?.hasError('required') && addDesignationForm.get('desigEnglish')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Designation English Name is required
            </div>
            <div *ngIf="addDesignationForm.get('desigEnglish')?.hasError('pattern') && addDesignationForm.get('desigEnglish')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Designation English Name should only contain alphabets
            </div>
          </div>

          <!-- Designation Hindi Name -->
          <div class="form-group">
            <label for="desigHindi">
              <i class="fa-solid fa-language filter-label-icon"></i>
              Designation Hindi Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="desigHindi"
              formControlName="desigHindi"
              placeholder="Enter Designation Hindi Name"
              autocomplete="off"
              (keypress)="restrictChar.onlyAlphabets($event)"
              class="filter-select">
            <div *ngIf="addDesignationForm.get('desigHindi')?.hasError('required') && addDesignationForm.get('desigHindi')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Designation Hindi Name is required
            </div>
            <div *ngIf="addDesignationForm.get('desigHindi')?.hasError('pattern') && addDesignationForm.get('desigHindi')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Designation Hindi Name should only contain alphabets
            </div>
          </div>

          <!-- Save / Cancel Buttons -->
          <div class="filter-btn-group">
            <button type="button" (click)="onSave()" class="btn-submit flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              Save
            </button>
            <button type="button" (click)="onCancel()" class="btn-clear flex items-center gap-2">
              <i class="fa-solid fa-xmark"></i>
              Cancel
            </button>
          </div>

        </div>
      </form>

    </div>
    <!-- END FORM CARD -->

  </div>
</div>
