<div class="forms">
  <div class="complain-form">

    <!-- ===================== FORM CARD ===================== -->
    <div class="person-card">

      <!-- Header -->
      <div class="section-header mb-6">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-gavel filter-header-icon"></i>
          <h3 class="filter-header-title">
            {{ editCourtType ? 'Edit / Update' : 'Add' }} Court Type
          </h3>
        </div>

        <!-- Back Button -->
        <button type="button" class="filter-toggle-btn" (click)="onCancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Back
        </button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="addCourtTypeForm">
        <div class="form-grid">

          <!-- Court Type Name -->
          <div class="form-group">
            <label for="courtTypeName">
              <i class="fa-solid fa-building-columns filter-label-icon"></i>
              Court Type Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="courtTypeName"
              formControlName="courtTypeName"
              placeholder="Enter Court Type Name"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addCourtTypeForm.get('courtTypeName')?.hasError('required') && addCourtTypeForm.get('courtTypeName')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Court Type Name is required
            </div>
          </div>

          <!-- Court Type Short Name -->
          <div class="form-group">
            <label for="courtTypeShortName">
              <i class="fa-solid fa-tag filter-label-icon"></i>
              Court Type Short Name
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="text"
              id="courtTypeShortName"
              formControlName="courtTypeShortName"
              placeholder="Enter Court Type Short Name"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addCourtTypeForm.get('courtTypeShortName')?.hasError('required') && addCourtTypeForm.get('courtTypeShortName')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Court Type Short Name is required
            </div>
          </div>

          <!-- Order No -->
          <div class="form-group">
            <label for="orderNo">
              <i class="fa-solid fa-arrow-down-1-9 filter-label-icon"></i>
              Order No
              <sup class="text-red-500 text-base ml-0.5">*</sup>
            </label>
            <input
              type="number"
              id="orderNo"
              formControlName="orderNo"
              placeholder="Enter Order No"
              autocomplete="off"
              class="filter-select">
            <div *ngIf="addCourtTypeForm.get('orderNo')?.hasError('required') && addCourtTypeForm.get('orderNo')?.touched"
              class="form-error">
              <i class="fa-solid fa-circle-exclamation"></i>
              Order No is required
            </div>
          </div>

          <!-- Save / Cancel Buttons -->
          <div class="filter-btn-group">
            <button type="button" (click)="onSave()" class="btn-submit flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              Save
            </button>
            <button type="button" (click)="onCancel()" class="btn-clear flex items-center gap-2">
              <i class="fa-solid fa-xmark"></i>
              Cancel
            </button>
          </div>

        </div>
      </form>

    </div>
    <!-- END FORM CARD -->

  </div>
</div>
