<div class="login-page">

  <!-- ── Left decorative panel ── -->
  <div class="login-left" aria-hidden="true">
    <div class="login-left__overlay"></div>

    <!-- floating rings -->
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>

    <div class="login-left__content">
      <div class="login-left__logo-wrap">
        <img src="assets/remove back logo.png" alt="PCMS Logo" class="login-left__logo">
      </div>
      <h1 class="login-left__title">PCMS</h1>
      <p class="login-left__subtitle">Prosecution Case Management System</p>
      <div class="login-left__divider"></div>
      <p class="login-left__tagline">Streamlining justice through digital excellence</p>

      <!-- decorative stats -->
      <div class="login-left__stats">
        <div class="lstat">
          <span class="lstat__num">24/7</span>
          <span class="lstat__label">Availability</span>
        </div>
        <div class="lstat-sep"></div>
        <div class="lstat">
          <span class="lstat__num">100%</span>
          <span class="lstat__label">Secure</span>
        </div>
        <div class="lstat-sep"></div>
        <div class="lstat">
          <span class="lstat__num">Gov</span>
          <span class="lstat__label">Certified</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Right form panel ── -->
  <div class="login-right">
    <div class="login-card">

      <!-- top accent bar -->
      <div class="login-card__topbar"></div>

      <!-- mobile logo (hidden on desktop) -->
      <div class="login-card__mobile-logo">
        <img src="assets/pcms_logo.jpeg" alt="Logo">
      </div>

      <div class="login-card__header">
        <div class="login-card__icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="login-card__title">Welcome Back</h2>
        <p class="login-card__sub">Sign in to your PCMS account</p>
      </div>

      <form [formGroup]="loginForm" class="login-form" (ngSubmit)="onSignIn()" autocomplete="off">

        <!-- Username -->
        <div class="lf-group" [class.lf-group--error]="loginForm.get('userName')?.invalid && loginForm.get('userName')?.touched">
          <label class="lf-label" for="userName">
            <i class="fa-solid fa-user lf-label__icon"></i>
            User Name
          </label>
          <div class="lf-input-wrap">
            <input
              type="text"
              id="userName"
              formControlName="userName"
              class="lf-input"
              placeholder="Enter your username"
              autocomplete="username"
            >
            <span class="lf-input__focus-line"></span>
          </div>
        </div>

        <!-- Password -->
        <div class="lf-group" [class.lf-group--error]="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
          <label class="lf-label" for="password">
            <i class="fa-solid fa-lock lf-label__icon"></i>
            Password
          </label>
          <div class="lf-input-wrap">
            <input
              type="password"
              id="password"
              formControlName="password"
              class="lf-input"
              placeholder="Enter your password"
              autocomplete="current-password"
            >
            <span class="lf-input__focus-line"></span>
          </div>
          <p class="lf-error" *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
            <i class="fa-solid fa-circle-exclamation"></i> Password is required
          </p>
        </div>

        <!-- Submit -->
        <button type="submit" class="lf-btn" (click)="onSignIn()">
          <span class="lf-btn__text">Sign In</span>
          <span class="lf-btn__icon"><i class="fa-solid fa-arrow-right-to-bracket"></i></span>
          <span class="lf-btn__shine"></span>
        </button>

      </form>

      <p class="login-card__footer">
        Prosecution Case Management System &copy; 2025
      </p>

    </div>
  </div>

</div>
