<div class="flex">
  <!-- side navigation - always in DOM, controlled by transform -->
  <div class="fixed lg:static  z-50 lg:z-auto lg:flex-shrink-0 transition-transform duration-300">
    <app-side-nav></app-side-nav>
  </div>
  
  <!-- main content -->
  <div 
    [ngClass]="isNavbarVisible ? 'lg:ml-64 xl:ml-64' : 'ml-0'" 
    class="w-full lg:flex-1 h-full overflow-y-auto transition-all duration-300">
    @if (showNav) { 
      <app-nav-bar (toggleSidebar)="handleToggleSidebar($event)"></app-nav-bar>
    }
    
   
      <router-outlet></router-outlet>
    
  </div>

  <app-notification></app-notification>
  <app-loader></app-loader>
</div>
