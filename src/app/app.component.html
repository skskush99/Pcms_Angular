<div class="flex flex-col h-screen">
  <!-- Header - Full Width, Fixed at Top -->
  @if (showNav) { 
    <app-nav-bar (toggleSidebar)="handleToggleSidebar($event)"></app-nav-bar>
  }
  
  <div class="flex flex-1 overflow-hidden">
    <!-- side navigation - always starts below header -->
    <div class="fixed z-40 lg:flex-shrink-0 transition-transform duration-300" 
         [style.top.px]="showNav ? 56 : 0">
      <app-side-nav></app-side-nav>
    </div>
    
    <!-- main content -->
    <div 
      [ngClass]="isNavbarVisible ? 'lg:ml-64 xl:ml-64' : 'ml-0'" 
      class="w-full lg:flex-1 overflow-y-auto overflow-x-hidden transition-all duration-300 content-scroll-area"
      [class.pt-0]="!showNav">
      <router-outlet></router-outlet>
    </div>
  </div>

  <app-notification></app-notification>
  <app-loader></app-loader>
</div>
